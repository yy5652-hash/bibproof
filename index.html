<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bibproof · Check every reference</title>
  <meta name="description" content="Paste a bibliography or drop a document. Bibproof checks every reference against Crossref, DataCite, OpenAlex and Europe PMC, flags invented and mismatched citations and retractions, and shows its evidence. Free, no sign-up, nothing uploaded." />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f4efe4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#15140f" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="canonical" href="https://yy5652-hash.github.io/bibproof/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Bibproof" />
  <meta property="og:title" content="Bibproof: every reference, proven before you submit" />
  <meta property="og:description" content="Catch invented citations, mismatched DOIs and retracted papers. Field-level evidence for every verdict. No cap, no sign-up, your document stays on your device." />
  <meta property="og:url" content="https://yy5652-hash.github.io/bibproof/" />
  <meta property="og:image" content="https://yy5652-hash.github.io/bibproof/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Bibproof: every reference, proven before you submit, with example verdicts." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Bibproof: every reference, proven before you submit" />
  <meta name="twitter:description" content="Catch invented citations, mismatched DOIs and retracted papers, with evidence for every verdict." />
  <meta name="twitter:image" content="https://yy5652-hash.github.io/bibproof/og.png" />
  <script>
    try { var t = localStorage.getItem('bibproof-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript><p style="padding:2rem;font-family:sans-serif">Bibproof needs JavaScript to read your document on this device and check each reference.</p></noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
